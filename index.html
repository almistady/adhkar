*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg) var(--pattern);background-size:116px 80px;
  line-height:1.8;font-size:17px;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:8px 12px;background:var(--green);color:var(--on-green);border-bottom:2px solid var(--gold)}
.bar-title{font-weight:700;font-size:20px}
.tools{display:flex;gap:6px}
.tool{min-width:44px;height:44px;border-radius:8px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);
  color:var(--on-green);display:grid;place-items:center;font-weight:700;line-height:1}
.tool:active{background:rgba(255,255,255,.25)}
.tool svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

main{max-width:640px;margin:0 auto;padding:14px 12px 40px}

.hero{position:relative;max-width:440px;aspect-ratio:300/230;margin:6px auto 14px}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.arch-fill{fill:var(--card)}
.arch-line{fill:none;stroke:var(--gold);stroke-width:2.2}
.arch-line2{fill:none;stroke:var(--gold);stroke-width:.8;opacity:.8}
.rose{fill:var(--gold-soft);stroke:var(--gold);stroke-width:.8}
.hero-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding-bottom:7%;text-align:center}
.bism{color:var(--gold);font-size:clamp(14px,4.4vw,19px);margin:0}
.hero h1{margin:.1em 0 0;font-size:clamp(25px,8.6vw,38px);line-height:1.25;color:var(--green)}
:root[data-theme="night"] .hero h1{color:var(--ink)}
.hero .sub{margin:.2em 0 0;font-size:clamp(17px,5.4vw,23px);font-weight:700;color:var(--green)}
:root[data-theme="night"] .hero .sub{color:var(--ink)}
.hero .cnt{margin:.4em 0 0;color:var(--muted);font-size:clamp(13px,3.9vw,16px)}

.install{background:var(--card);border:1px solid var(--gold);border-radius:8px;padding:12px 14px;margin:0 0 14px}
.install h2{margin:0 0 4px;font-size:20px;color:var(--green)}
:root[data-theme="night"] .install h2{color:var(--ink)}
.install p{margin:0 0 6px;font-size:17px}
.install ol{margin:6px 0 8px;padding:0 22px 0 0;font-size:17px}
.install li{margin:2px 0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:44px;padding:6px 16px;border-radius:8px;border:1px solid var(--green);background:transparent;font-weight:700;color:var(--green)}
:root[data-theme="night"] .btn{color:var(--ink);border-color:var(--gold)}
.btn.primary{background:var(--green);color:var(--on-green)}

.tabs{display:flex;gap:0;margin:0 0 14px;border:1px solid var(--gold);border-radius:8px;overflow:hidden;background:var(--card)}
.tab-btn{flex:1;min-height:48px;border:0;background:transparent;font-weight:700;font-size:18px;padding:4px 8px;line-height:1.3}
.tab-btn[aria-selected="true"]{background:var(--green);color:var(--on-green)}
.tab-btn small{display:block;font-weight:400;font-size:14px;opacity:.85}

.card{display:flex;background:var(--card);border:1px solid var(--gold-soft);border-radius:6px;margin:0 0 12px;overflow:hidden}
.card.done{background:var(--done)}
.num{flex:0 0 auto;min-width:40px;background:var(--green);color:var(--on-green);font-weight:700;font-size:17px;
  display:flex;justify-content:center;padding-top:10px}
.body{flex:1;min-width:0;padding:10px 12px 12px}
.txt{margin:0 0 8px;font-size:var(--fs);font-weight:700;line-height:1.95;overflow-wrap:break-word}
.meta{margin:0;font-size:calc(var(--fs) * .62);line-height:1.7;color:var(--muted)}
.meta div{margin:1px 0}
.meta dt{display:inline;font-weight:700;color:var(--green)}
:root[data-theme="night"] .meta dt{color:var(--gold)}
.meta dt::after{content:": "}
.meta dd{display:inline;margin:0}
.chip{background:var(--chip);color:var(--chip-ink);padding:0 8px;border-radius:4px}
.acts{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.count{min-height:48px;min-width:132px;padding:4px 18px;border-radius:24px;border:2px solid var(--green);background:transparent;
  font-weight:700;font-size:20px;color:var(--green);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:root[data-theme="night"] .count{color:var(--ink);border-color:var(--gold)}
.count:active{background:var(--chip)}
.count.full{background:var(--green);color:var(--on-green);border-color:var(--green)}
.mini{min-height:44px;padding:4px 14px;border-radius:8px;border:1px solid var(--gold);background:transparent;font-size:17px;color:var(--ink)}

footer{margin:22px 0 0;text-align:center;color:var(--muted);font-size:15px}
footer .btn{margin-top:6px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:90%;
  background:var(--green);color:var(--on-green);padding:10px 18px;border-radius:24px;font-size:17px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
[hidden]{display:none!important}
</style>
</head>

<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById("data").textContent);
var mem = {};
function lsGet(k){ try{ var v = localStorage.getItem(k); return v === null ? (mem[k]||null) : v; }catch(e){ return mem[k]||null; } }
function lsSet(k,v){ mem[k]=v; try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ delete mem[k]; try{ localStorage.removeItem(k); }catch(e){} }
function $(id){ return document.getElementById(id); }
var AR = "٠١٢٣٤٥٦٧٨٩";
function ar(n){ return String(n).replace(/\d/g,function(d){ return AR[d]; }); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

/* ---------- زخرفة القمة ---------- */
(function(){
  var NS="http://www.w3.org/2000/svg", g=$("rosette"), out="";
  for(var k=0;k<16;k++){
    var l = k%2===0 ? 17 : 11, w = k%2===0 ? 5 : 3.6;
    out += '<path class="rose" transform="rotate('+(k*22.5)+')" d="M0 0C'+w+' '+(l*.3)+' '+(w*.6)+' '+(l*.8)+' 0 '+l+'C'+(-w*.6)+' '+(l*.8)+' '+(-w)+' '+(l*.3)+' 0 0Z"/>';
  }
  out += '<circle r="4" class="rose"/>';
  g.innerHTML = out;
})();

/* ---------- التفضيلات ---------- */
var prefs = {fs:24, theme:null};
try{ var p = JSON.parse(lsGet("adhkar:prefs")||"{}"); if(p.fs) prefs.fs=p.fs; if(p.theme) prefs.theme=p.theme; }catch(e){}
if(!prefs.theme){ prefs.theme = (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "night" : "light"; }
function savePrefs(){ lsSet("adhkar:prefs", JSON.stringify(prefs)); }
function applyPrefs(){
  document.documentElement.style.setProperty("--fs", prefs.fs+"px");
  document.documentElement.setAttribute("data-theme", prefs.theme==="night" ? "night" : "light");
  var m = document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute("content", prefs.theme==="night" ? "#0E221B" : "#1F5F4A");
}
$("fs-plus").onclick = function(){ prefs.fs = Math.min(40, prefs.fs+2); applyPrefs(); savePrefs(); };
$("fs-minus").onclick = function(){ prefs.fs = Math.max(18, prefs.fs-2); applyPrefs(); savePrefs(); };
$("theme").onclick = function(){ prefs.theme = prefs.theme==="night" ? "light" : "night"; applyPrefs(); savePrefs(); };
applyPrefs();

/* ---------- العدّادات (تبدأ من الصفر كل يوم) ---------- */
function today(){ var d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
var counts = {};
(function(){
  try{ var c = JSON.parse(lsGet("adhkar:counts")||"{}"); if(c.d === today() && c.c) counts = c.c; }catch(e){}
})();
function saveCounts(){ lsSet("adhkar:counts", JSON.stringify({d:today(), c:counts})); }

/* ---------- الواجهة ---------- */
var total = 0; DATA.sections.forEach(function(s){ total += s.items.length; });
$("total").textContent = ar(total) + " ذكراً ودعاءً";
var current = 0;

function tabs(){
  var h = "";
  DATA.sections.forEach(function(s,i){
    h += '<button class="tab-btn" role="tab" id="tab'+i+'" aria-selected="'+(i===current)+'" data-i="'+i+'">'+esc(s.title)+'<small>'+ar(s.items.length)+'</small></button>';
  });
  $("tabs").innerHTML = h;
}
function card(it){
  var n = counts[it.n] || 0, full = it.target && n >= it.target;
  var lines = it.t.split("\n").map(esc).join("<br>");
  var h = '<article class="card'+(full?' done':'')+'" data-n="'+it.n+'"><div class="num">'+ar(it.n)+'</div><div class="body">';
  h += '<p class="txt">'+lines+'</p><dl class="meta">';
  if(it.w) h += '<div><dt>العدد / الوقت</dt><dd>'+esc(it.w)+'</dd></div>';
  h += '<div><dt>المصدر</dt><dd>'+esc(it.s)+'</dd></div>';
  h += '<div><dt>الدرجة</dt><dd><span class="chip">'+esc(it.g)+'</span></dd></div></dl><div class="acts">';
  if(it.target){
    h += '<button class="count'+(full?' full':'')+'" data-act="count" aria-label="عدّاد التكرار">'+(full ? 'تم ✓' : ar(n)+' / '+ar(it.target))+'</button>';
    if(n>0) h += '<button class="mini" data-act="zero">إعادة</button>';
  }
  h += '<button class="mini" data-act="copy">نسخ</button></div></div></article>';
  return h;
}
function render(){
  tabs();
  $("list").setAttribute("aria-labelledby","tab"+current);
  $("list").innerHTML = DATA.sections[current].items.map(card).join("");
}
function findItem(n){
  for(var i=0;i<DATA.sections.length;i++){ var a=DATA.sections[i].items; for(var j=0;j<a.length;j++){ if(a[j].n===n) return a[j]; } }
}
var tt;
function toast(msg){ var t=$("toast"); t.textContent=msg; t.className="show"; clearTimeout(tt); tt=setTimeout(function(){ t.className=""; },1800); }
function copyText(s){
  if(navigator.clipboard && navigator.clipboard.writeText){ return navigator.clipboard.writeText(s); }
  return new Promise(function(res,rej){
    try{ var ta=document.createElement("textarea"); ta.value=s; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta);
      ta.select(); var ok=document.execCommand("copy"); document.body.removeChild(ta); ok?res():rej(); }catch(e){ rej(e); }
  });
}
$("tabs").addEventListener("click",function(e){
  var b = e.target.closest(".tab-btn"); if(!b) return;
  current = +b.getAttribute("data-i"); render(); window.scrollTo(0,0);
});
$("list").addEventListener("click",function(e){
  var b = e.target.closest("button[data-act]"); if(!b) return;
  var c = b.closest(".card"), n = +c.getAttribute("data-n"), it = findItem(n), act = b.getAttribute("data-act");
  if(act==="count"){
    var v = counts[n]||0;
    if(it.target && v >= it.target){ return; }
    counts[n] = v+1; saveCounts();
    try{ if(navigator.vibrate) navigator.vibrate(counts[n]>=it.target ? [30,40,30] : 12); }catch(x){}
    var y = window.scrollY; var parent = c.parentNode; var tmp = document.createElement("div"); tmp.innerHTML = card(it);
    parent.replaceChild(tmp.firstChild, c); window.scrollTo(0,y);
  } else if(act==="zero"){
    counts[n] = 0; saveCounts();
    var tmp2 = document.createElement("div"); tmp2.innerHTML = card(it); c.parentNode.replaceChild(tmp2.firstChild, c);
  } else if(act==="copy"){
    copyText(it.t + "\n\nالمصدر: " + it.s).then(function(){ toast("تم النسخ"); },function(){ toast("تعذّر النسخ"); });
  }
});
$("reset").onclick = function(){ counts = {}; saveCounts(); render(); toast("أُعيد ضبط العدّادات"); };
render();

    s.innerHTML = '<ol><li>افتح هذه الصفحة في متصفح <b>Safari</b>.</li><li>اضغط زر المشاركة <b>(مربع وسهم للأعلى)</b> أسفل الشاشة.</li><li>اختر <b>«إضافة إلى الشاشة الرئيسية»</b> ثم اضغط <b>«إضافة»</b>.</li></ol>';
  } else {
    s.innerHTML = '<ol><li>اضغط قائمة المتصفح <b>(⋮ ثلاث نقاط)</b>.</li><li>اختر <b>«تثبيت التطبيق»</b> أو <b>«إضافة إلى الشاشة الرئيسية»</b>.</li></ol>';
  }
  $("install").hidden = false;
}

  e.preventDefault(); deferred = e; $("install-go").hidden = false;
});
window.addEventListener("appinstalled",function(){ $("install").hidden = true; toast("تم التثبيت"); });
$("install-go").onclick = function(){
  if(!deferred) return;
  deferred.prompt();
  deferred.userChoice.then(function(){ deferred = null; $("install-go").hidden = true; });
};
$("install-hide").onclick = function(){ $("install").hidden = true; lsSet("adhkar:hideInstall","1"); };
showInstall();

/* ---------- العمل بدون إنترنت ---------- */
if(served && "serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").then(function(){
    return navigator.serviceWorker.ready;
  }).then(function(){
    if(!lsGet("adhkar:offlineNote")){ lsSet("adhkar:offlineNote","1"); toast("جاهزة للعمل بدون إنترنت"); }
  }).catch(function(){});
}
})();
</script>
